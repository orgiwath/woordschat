# Nginx reverse-proxy config for Woordschat.
# Install on the Ubuntu host (NOT inside Docker) at:
#   /etc/nginx/sites-available/woordschat.conf
# then: sudo ln -s /etc/nginx/sites-available/woordschat.conf /etc/nginx/sites-enabled/
#
# Replace woordschat.example.com with your real domain/subdomain
# (e.g. a free subdomain from OVH, or one you already own) before use.
# See README.md for the full step-by-step (including obtaining the
# certificate with certbot, which will rewrite the "listen 443" block below).

server {
    listen 80;
    listen [::]:80;
    server_name woordschat.example.com;

    # Needed for certbot's HTTP-01 challenge; certbot creates this itself.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name woordschat.example.com;

    # certbot --nginx will fill these in automatically the first time you run it.
    ssl_certificate     /etc/letsencrypt/live/woordschat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woordschat.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
