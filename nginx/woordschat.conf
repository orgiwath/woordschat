# Nginx reverse-proxy config for Woordschat.
# Install at:
#   /etc/nginx/sites-available/woordschat.conf
# then: sudo ln -s /etc/nginx/sites-available/woordschat.conf /etc/nginx/sites-enabled/
#
# Replace woordschat.example.com with your real domain/subdomain before use.
# See README.md for the full step-by-step (including obtaining the
# certificate with certbot, which will rewrite the "listen 443" block below).
#
# IMPORTANT — proxy_pass target below depends on WHERE Nginx runs:
#   - Nginx on the SAME host/container as Docker  -> http://127.0.0.1:3210
#     (and set docker-compose.yml's port back to "127.0.0.1:3210:3000")
#   - Nginx on a DIFFERENT host/LXC/VM (common in a homelab, e.g. a
#     separate reverse-proxy box) -> http://<ip-of-the-docker-host>:3210
#     (keep docker-compose.yml's port as "3210:3000" so it's reachable
#     over the LAN/VPN from that other host)

server {
    listen 80;
    listen [::]:80;
    server_name woordschat.example.com;

    # Needed for certbot's HTTP-01 challenge; certbot creates this itself.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name woordschat.example.com;

    # certbot --nginx will fill these in automatically the first time you run it.
    ssl_certificate     /etc/letsencrypt/live/woordschat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woordschat.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        # Replace with the Docker host's LAN IP if Nginx runs elsewhere
        # (see the note at the top of this file).
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
